<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Student Details</title>
    </head>

    <body>
        <h3>Student Details</h3>
        
        Welcome <span th:text="${student.firstName} + ' ' + ${student.lastName}"></span>!

        <br><br>

        From the Country of <span th:text="${student.country}"></span>!

        <br><br>

        Favorite Programming Language of <span th:text="${student.favoriteLanguage}"></span>!

        <br><br>

        Favorite Operating Systems:
        <ul>
            <li th:each="tempSystems : ${student.favoriteSystems}" th:text="${tempSystems}"></li>
        </ul>

        <br><br>
    </body>
</html>
