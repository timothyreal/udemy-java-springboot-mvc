<!DOCTYPE html>
<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>

<head>
    <meta charset="UTF-8">
    <title>Company Home Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous" />

</head>

<body>
    <h2>Company Home Page</h2>
    <hr>

    <p>
        Welcome to company home page!
    </p>

    <hr>
    
    <div sec:authorize="isAuthenticated()">
        <p>
            <a th:href="@{/employees}">Employees Page</a>
        </p>
    </div>

    <div sec:authorize="isAnonymous()">
        <a th:href="@{/showMyLoginPage}" class="btn btn-primary mt-3" role="button"
            aria-pressed="true">Sign in</a>
    </div>

    <div>
        <a th:href="@{/registration/showRegistrationForm}" class="btn btn-secondary mt-3" role="button"
            aria-pressed="true">Register New User</a>
    </div>

</body>

</html>
