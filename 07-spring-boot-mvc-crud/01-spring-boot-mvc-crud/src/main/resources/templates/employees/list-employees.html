<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>Employee Dictionary</title>
</head>
<body>
    <div class="container">
        <h3>Employee</h3>

        <a th:href="@{/employees/addEmployeeForm}" class="btn btn-solid btn-sm theme-primary mb-3">Add Employee</a>

        <hr>

        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="employee : ${employees}">
                    <td th:text="${employee.firstName}"></td>
                    <td th:text="${employee.lastName}"></td>
                    <td th:text="${employee.email}"></td>
                    <td>
                        <a th:href="@{/employees/updateEmplyeeForm(employeeId=${employee.id})}" class="btn btn-solid btn-sm theme-primary">Update</a>
                        <a th:href="@{/employees/delete(employeeId=${employee.id})}" class="btn btn-solid btn-sm theme-danger" onclick="if(!(confirm('Are you sure you want to delte this employee?'))) return false">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
